name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm test

      # No NPM_TOKEN: npm exchanges the GitHub OIDC token for a short-lived publish credential.
      - run: npm publish --provenance --access public
